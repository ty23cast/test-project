<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Simple File Browser</title>
    </head>
    <body>
        <h1>Simple File Browser</h1>
        <p>Type a folder path and click Browse.</p>

        <input id="pathInput" placeholder="Example: ." />
        <button id="browseButton">Browse</button>

        <h2>Result</h2>
        <pre id="output">Loading...</pre>

        <script>
            var pathInput = document.getElementById("pathInput");
            var browseButton = document.getElementById("browseButton");
            var output = document.getElementById("output");

            function loadFolder() {
                var path = pathInput.value;

                if (path.length === 0) {
                    path = ".";
                }

                output.textContent = "Loading...";

                fetch("/Test?path=" + encodeURIComponent(path))
                    .then(function (response) {
                        return response.json();
                    })
                    .then(function (data) {
                        output.textContent = JSON.stringify(data, null, 2);
                    })
                    .catch(function (error) {
                        output.textContent = "Error: " + error.message;
                    });
            }

            browseButton.addEventListener("click", loadFolder);

            pathInput.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    loadFolder();
                }
            });

            loadFolder();
        </script>
    </body>
</html>
